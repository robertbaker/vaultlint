name: Password manager support request
description: Request support for a password manager or its export format.
title: "[Support]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Use this form to request support for a password manager or export format. **Never attach or paste your real vault export.** Any sample must be a small, synthetic file containing entirely made-up entries and credentials.

  - type: input
    id: manager
    attributes:
      label: Password manager
      description: Name the password manager you want vaultlint to support.
      placeholder: e.g. Example Password Manager
    validations:
      required: true

  - type: input
    id: export_format
    attributes:
      label: Export format
      description: Format and file extension, if known.
      placeholder: e.g. JSON (.json), CSV (.csv), XML (.xml)
    validations:
      required: true

  - type: textarea
    id: request
    attributes:
      label: What support do you need?
      description: Tell us whether you need import, export, or conversion support, and any relevant version or platform details.
      placeholder: Describe the use case and how you export your data.
    validations:
      required: true

  - type: textarea
    id: sample
    attributes:
      label: Optional synthetic sample export
      description: |
        A small sample can help us understand the format. If useful, attach a fabricated export in a follow-up comment after submitting this issue. Use made-up entries and credentials. **Never share your real vault file, even if you remove some entries.** Do not include real names, usernames, URLs, passwords, notes, TOTP seeds, recovery codes, or other personal data. Leave this blank if you cannot safely create a synthetic sample.
      placeholder: Describe the fabricated sample you can provide, or leave blank.
    validations:
      required: false

  - type: textarea
    id: references
    attributes:
      label: Documentation or references
      description: Optional links to the manager's export documentation or a public description of the format. Do not link to a real vault file.
    validations:
      required: false
