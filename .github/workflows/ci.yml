name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
      cli: ${{ steps.filter.outputs.cli }}
      web: ${{ steps.filter.outputs.web }}
      e2e_app: ${{ steps.filter.outputs.e2e_app }}
      e2e_specs: ${{ steps.filter.outputs.e2e_specs }}
      e2e_specs_files: ${{ steps.filter.outputs.e2e_specs_files }}
      site: ${{ steps.filter.outputs.site }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'push'
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          list-files: shell
          filters: |
            code:
              - 'apps/**'
              - 'packages/**'
              - 'e2e/**'
              - 'playwright.config.ts'
              - 'package.json'
              - 'bun.lock'
              - 'tsconfig.json'
              - 'oxlint.json'
              - '.oxfmtrc.json'
              - '.github/workflows/**'
              - '.github/actions/**'
            cli:
              - 'apps/cli/**'
              - 'packages/**'
              - 'package.json'
              - 'bun.lock'
              - 'tsconfig.json'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            web:
              - 'apps/web/**'
              - 'packages/**'
              - 'package.json'
              - 'bun.lock'
              - 'tsconfig.json'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            e2e_app:
              - 'apps/web/**'
              - 'packages/**'
              - 'playwright.config.ts'
              - 'package.json'
              - 'bun.lock'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            e2e_specs:
              - 'e2e/**/*.spec.ts'
            site:
              - 'apps/site/**'
              - 'packages/brand/**'
              - 'e2e-site/**'
              - 'playwright.site.config.ts'
              - 'CHANGELOG.md'
              - 'package.json'
              - 'bun.lock'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'

  # Independent checks run in parallel; the `ci` job remains the single required status.
  static:
    name: Lint & format
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: bun run lint
      - run: bun run format:check
      - if: failure()
        uses: ./.github/actions/cancel-run

  typecheck:
    name: Typecheck
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: bun run typecheck
      - if: failure()
        uses: ./.github/actions/cancel-run

  unit:
    name: Unit tests
    needs: changes
    if: needs.changes.outputs.cli == 'true' || needs.changes.outputs.web == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: bun run test:packages
      - if: needs.changes.outputs.cli == 'true'
        run: bun run test:cli
      - if: needs.changes.outputs.web == 'true'
        run: bun run test:web
      - if: failure()
        uses: ./.github/actions/cancel-run

  cli:
    name: CLI build & pack
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: LTS
            node: lts/*
          - label: Current
            node: node
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - uses: ./.github/actions/setup
      - run: bun run build:publish
      - name: Smoke test publish/ tarball
        run: bun run test:publish
      - if: failure()
        uses: ./.github/actions/cancel-run

  e2e:
    name: E2E
    needs: changes
    if: needs.changes.outputs.e2e_app == 'true' || needs.changes.outputs.e2e_specs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      # Browser binaries are cached; Linux system dependencies still need installation per runner.
      - run: bunx playwright install --with-deps --only-shell chromium
        timeout-minutes: 5
      - run: bun run build:web
        timeout-minutes: 5
      - name: Run E2E tests
        timeout-minutes: 5
        env:
          FULL_SUITE: ${{ needs.changes.outputs.e2e_app }}
          CHANGED_SPECS: ${{ needs.changes.outputs.e2e_specs_files }}
        run: |
          if [ "$FULL_SUITE" = "true" ]; then
            bun run e2e
          else
            specs=""
            for file in $CHANGED_SPECS; do
              [ -f "$file" ] && specs="$specs $file"
            done
            if [ -z "$specs" ]; then
              echo "No changed E2E specs left to run."
              exit 0
            fi
            echo "Running changed specs:$specs"
            bunx playwright test $specs
          fi
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - if: failure()
        uses: ./.github/actions/cancel-run

  site:
    name: Site accessibility
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - run: bunx playwright install --with-deps --only-shell chromium
        timeout-minutes: 5
      - name: Build site and run axe checks
        timeout-minutes: 8
        run: bun run e2e:site
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: site-playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - if: failure()
        uses: ./.github/actions/cancel-run

  # Skipped filtered jobs pass; failed or cancelled checks fail the single required status.
  ci:
    name: CI
    needs: [changes, static, typecheck, unit, cli, e2e, site]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: |
          echo '${{ toJSON(needs) }}' | grep -Eq '"result": "(failure|cancelled)"' && exit 1
          exit 0
